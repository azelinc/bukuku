<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Hub</title>
    <link rel="stylesheet" href="pc.css" media="screen and (min-width: 601px)">
    <link rel="stylesheet" href="mobile.css" media="screen and (max-width: 600px)">
    <style>
        .nav-grid { display: flex; flex-direction: column; gap: 12px; margin: 15px 0; }
        .btn {
            display: block; width: 100%; padding: 18px; font-size: 1.2rem; font-weight: 800;
            color: white; text-decoration: none; border-radius: 18px; border: none;
            cursor: pointer; text-align: center; transition: 0.2s;
        }
        .orange-btn { background: #f39c12; border-bottom: 6px solid #c87f0a; }
        .blue-btn { background: #4a90e2; border-bottom: 5px solid #2e6cb5; }
        .red-btn { background: #e74c3c; border-bottom: 6px solid #c0392b; }
        .btn:active { transform: translateY(3px); border-bottom-width: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Games Hub</h1>
        <p style="margin-bottom: 25px; color: #666;">Choose a game to start your challenge!</p>
        
        <div class="nav-grid">
            <!-- GAME 1: ORANGE TILE -->
            <a href="game-memory-match.html" class="btn orange-btn">
                <span style="font-size: 2.5rem; display: block; margin-bottom: 5px;">✨</span>
                Magic Emoji Match
                <small style="display: block; font-size: 0.8rem; font-weight: normal; opacity: 0.9;">Test your memory!</small>
            </a>
            
            <!-- GAME 2: BLUE TILE (Added margin-top for spacing) -->
            <a href="game-dragon-dash.html" class="btn blue-btn" style="margin-top: 15px;">
                <span style="font-size: 2.5rem; display: block; margin-bottom: 5px;">🐉</span>
                Dragon Dash
                <small style="display: block; font-size: 0.8rem; font-weight: normal; opacity: 0.9;">Catch the falling stars!</small>
            </a>
        </div>

        <hr style="margin: 30px 0; opacity: 0.1;">
        
        <!-- BACK BUTTON: RED TILE -->
        <a href="index.html" class="btn red-btn">🏠 Back to Main Menu</a>
    </div>

</body>
</html>
